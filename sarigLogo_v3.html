<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarig Logo V3 - Final</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;700&display=swap');

    :root {
      --bg: #f7f2e9;
      --ink: #1f2328;
      --muted: #65707d;
      --card: #FFFFFF;
      --line: #e7dfd0;

      --brand-deep: #120E0E;
      --brand-main: #800000;
      --brand-accent: #FFB703;
      --brand-soft-main: #E5E1E1;
      --brand-soft: #fff6ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 15% -10%, #fff4de 0%, transparent 60%),
        radial-gradient(900px 400px at 90% 100%, #ffe7d5 0%, transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 22px 55px rgba(24, 28, 34, 0.12);
      padding: clamp(22px, 4vw, 44px);
      background-color: #FFFFFF;
    }

    .topline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: #8f3c24;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hero {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 22px;
      align-items: center;
    }

    .icon-shell {
      width: 160px;
      height: 160px;
      border-radius: 38px;
      background: linear-gradient(135deg, #800000 0%, #120E0E 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 16px 35px rgba(43, 36, 31, 0.35);
    }

    .wordmark {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 800;
      margin: 0;
    }

    .wordmark .dot { color: var(--brand-main); }

    .tagline {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      letter-spacing: 0.03em;
      font-weight: 600;
    }

    .spec {
      margin-top: 28px;
      border-top: 1px dashed var(--line);
      padding-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .item { padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .item b { font-family: 'Sora', sans-serif; font-size: 0.92rem; display: block; margin-bottom: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; color: #576271; }

    .chips { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
    .chip { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(0,0,0,.08); }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .icon-shell { margin: 0 auto; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <div class="topline">Sarig Final Identity</div>

    <div class="hero">
      <div class="icon-shell" aria-label="Sarig app icon">
        <svg viewBox="0 0 100 100" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 20 C 10 20, 10 48, 30 48 L 68 48 C 88 48, 88 80, 66 80 L 48 80" stroke="var(--brand-soft-main)" stroke-width="12" stroke-linecap="round"/>
          <path d="M68 20 L 48 20" stroke="var(--brand-soft-main)" stroke-width="12" stroke-linecap="round"/>
          <!-- <circle cx="73" cy="20" r="6" fill="#FFB703"/> -->
        </svg>
      </div>

      <div>
        <h1 class="wordmark">sarig<span class="dot">.</span></h1>
        <p class="tagline">Your city, delivered.</p>
      </div>
    </div>

    <div class="spec">
      <div class="item">
        <b>Color System</b>
        <div class="chips">
          <!-- <span class="chip" style="background:#2F2A24"></span> -->
          <span class="chip" style="background:#120E0E"></span>
          <span class="chip" style="background:#800000"></span>
          <span class="chip" style="background:#E5E1E1"></span>
          <!-- <span class="chip" style="background:#FFFFFF"></span> -->
        </div>
        <div class="mono">#120E0E Â· #800000 Â· #FFFFFF</div>
      </div>

      <div class="item">
        <b>Typography</b>
        <div class="mono">Wordmark/Headlines: Sora</div>
        <div class="mono">UI/Body: Manrope</div>
      </div>

      <div class="item">
        <b>Asset Modes</b>
        <div class="mono">Primary: Icon + Wordmark</div>
        <div class="mono">App: Icon only</div>
      </div>

      <div class="item">
        <b>Suggested Exports</b>
        <div class="mono">1024, 512, 192, 180, 64 px</div>
      </div>
    </div>
  </section>
</body>
</html>
