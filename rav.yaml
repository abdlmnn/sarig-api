scripts:
  dev:
    - python manage.py runserver 8000

  mobile:
    - python manage.py runserver 0.0.0.0:8000 --noreload

  migrate:
    - python manage.py makemigrations
    - python manage.py migrate

  admin:
    - python manage.py createsuperuser

  shell:
    - python manage.py shell

  clean_db:
    - python manage.py flush

  check:
    - python manage.py check

  test:
    - python manage.py test

  tunnel:
    - ngrok http 8000

  seed_onboarding:
    - python manage.py seed_onboarding_mock_data --reset

  ngrok-auth:
    - python -c "import os, subprocess; from dotenv import load_dotenv; load_dotenv(); token=os.getenv('NGROK_AUTHTOKEN'); subprocess.run(['ngrok', 'config', 'add-authtoken', token]) if token else print('Error: NGROK_AUTHTOKEN not found in .env')"

  celery:
    - celery -A config worker -l info

  celery-beat:
    - celery -A config beat -l info
