name: Sarig API CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Code Formatting & Syntax (Linting)
      run: |
        pip install flake8
        # All exclusion rules are defined in .flake8 config file at the project root.
        # This is the most reliable cross-platform way to configure flake8.
        flake8 .
      env:
        SECRET_KEY: "dummy-key-for-ci"
        DEBUG: "1"
        
    - name: Verify Database Migrations
      env:
        SECRET_KEY: "dummy-key-for-ci"
        DEBUG: "1"
      run: |
        # This guarantees that no developer merges broken database changes.
        python manage.py makemigrations --check --dry-run
        python manage.py migrate

